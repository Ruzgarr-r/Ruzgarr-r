name: Generate Pacman Contribution Graph

on:
  # Her gece saat 00:00'da otomatik çalışır
  schedule:
    - cron: "0 0 * * *"
  
  # Manuel olarak tetiklemeye izin verir
  workflow_dispatch:
  
  # main dalına kod gönderildiğinde çalışır
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pacman animasyonlu SVG dosyasını üretir
      - name: generate pacman.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman.svg?palette=pacman

      # Üretilen SVG dosyasını "output" adında ayrı bir dala (branch) pushlar
      - name: push pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
